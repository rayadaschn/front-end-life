name: deploy-gh-pages

on:
  push:
    branches:
      - sourcecode
    paths-ignore: # 下列文件的变更不触发部署
      - README.md
      - LICENSE
  pull_request:
    branches:
      - sourcecode
    types: [closed]
  schedule:
    - cron: '30 5,11 * * *'

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # repo-token: ${{ secrets.DEPLOY_TOKEN }}
          # submodules: true

      - name: Set Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: npm install
        run: npm ci

      - name: Build docs
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          npm run docs:build
          touch docs/.vuepress/dist/.nojekyll

      - name: Deploy docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          branch: master
          folder: docs/.vuepress/dist/
          clean: true
